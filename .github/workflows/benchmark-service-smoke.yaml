name: benchmark-service-smoke (reusable)

on:
  workflow_call:
    inputs:
      benchmark_name:
        description: "Benchmark name. Defaults to the repository name with -benchmark-service stripped."
        required: false
        default: ""
        type: string
      docker_build_ssh:
        description: "Enable Docker BuildKit SSH forwarding for services with private git dependencies."
        required: false
        default: false
        type: boolean
      checkout_submodules:
        description: "Checkout git submodules before building the benchmark service image."
        required: false
        default: false
        type: boolean
      no_model_gateway:
        description: "Pass no_model_gateway=true to agents that support direct provider credentials."
        required: false
        default: true
        type: boolean
    outputs:
      valkyrie_run_id:
        description: "Valkyrie run id created by the smoke workflow."
        value: ${{ jobs.smoke.outputs.valkyrie_run_id }}
    secrets:
      VALKYRIE_AWS_ROLE_ARN:
        required: true
      NGROK_AUTHTOKEN:
        required: true
      NGROK_API_KEY:
        required: false
      NGROK_URL:
        required: false
      NGROK_PUBLIC_URL:
        required: false
      SMOKE_DATASET:
        required: true
      SMOKE_TASK_ID:
        required: true
      SMOKE_AGENT:
        required: true
      SMOKE_MODEL:
        required: true
      BENCHMARK_SERVICE_ENV:
        required: false
      BENCHMARK_SERVICE_AWS_SECRET_REFS:
        required: false
      SSH_PRIVATE_KEY:
        required: false
      GH_PAT:
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  SERVICE_PORT: "8001"
  CONTAINER_PORT: "8001"
  PROXY_PORT: "18001"
  HEALTH_PATH: /health
  VALKYRIE_REF: prod
  VALKYRIE_CONFIG_SECRET_ID: devBenchmarksInfraValkyrieConfig
  NO_MODEL_GATEWAY: ${{ inputs.no_model_gateway }}
  WAIT_ATTEMPTS: "90"
  BENCHMARK_NAME_INPUT: ${{ inputs.benchmark_name }}
  DOCKER_BUILD_SSH: ${{ inputs.docker_build_ssh }}
  NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
  NGROK_API_KEY: ${{ secrets.NGROK_API_KEY }}
  NGROK_URL: ${{ secrets.NGROK_URL }}
  NGROK_PUBLIC_URL: ${{ secrets.NGROK_PUBLIC_URL }}
  GH_PAT: ${{ secrets.GH_PAT }}
  SMOKE_DATASET: ${{ secrets.SMOKE_DATASET }}
  SMOKE_TASK_ID: ${{ secrets.SMOKE_TASK_ID }}
  SMOKE_AGENT: ${{ secrets.SMOKE_AGENT }}
  SMOKE_MODEL: ${{ secrets.SMOKE_MODEL }}
  BENCHMARK_SERVICE_ENV: ${{ secrets.BENCHMARK_SERVICE_ENV }}
  BENCHMARK_SERVICE_AWS_SECRET_REFS: ${{ secrets.BENCHMARK_SERVICE_AWS_SECRET_REFS }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      valkyrie_run_id: ${{ steps.start-run.outputs.valkyrie_run_id }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.checkout_submodules && 'recursive' || 'false' }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Validate and resolve smoke configuration
        run: |
          set -euo pipefail

          missing=0
          require_env() {
            if [ -z "${!1:-}" ]; then
              echo "::error::${1} is required for benchmark-service-smoke"
              missing=1
            fi
          }

          require_env SMOKE_DATASET
          require_env SMOKE_TASK_ID
          require_env SMOKE_AGENT
          require_env SMOKE_MODEL
          require_env NGROK_AUTHTOKEN

          if [ "$missing" -ne 0 ]; then
            exit "$missing"
          fi

          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          import re
          import sys

          def derive_benchmark_name(repository: str) -> str:
              repo_name = repository.rsplit("/", 1)[-1]
              if repo_name.endswith("-benchmark-service"):
                  return repo_name[: -len("-benchmark-service")]
              if repo_name.endswith("BenchmarkService"):
                  repo_name = repo_name[: -len("BenchmarkService")]
              return re.sub(r"[^a-z0-9-]+", "-", repo_name.lower()).strip("-")

          benchmark_name = os.environ["BENCHMARK_NAME_INPUT"].strip()
          if not benchmark_name:
              benchmark_name = derive_benchmark_name(os.environ["GITHUB_REPOSITORY"])
          if not re.fullmatch(r"[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?", benchmark_name):
              sys.exit(f"Invalid benchmark name: {benchmark_name!r}")

          container_name = f"{benchmark_name}-benchmark-service"
          print(f"BENCHMARK_NAME={benchmark_name}")
          print(f"CONTAINER_NAME={container_name}")
          PY

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.VALKYRIE_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Valkyrie prod package
        run: |
          uv tool install --force "git+https://github.com/vals-ai/Valkyrie.git@${VALKYRIE_REF}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Docker build SSH
        if: ${{ inputs.docker_build_ssh }}
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Build and run benchmark service
        run: |
          set -euo pipefail

          docker_build_args=()
          if [ "${DOCKER_BUILD_SSH}" = "true" ]; then
            docker_build_args+=(--ssh default)
          fi
          if [ -n "${GH_PAT:-}" ]; then
            docker_build_args+=(--secret id=gh_token,env=GH_PAT)
          fi

          docker_env_args=()
          if [ -n "${BENCHMARK_SERVICE_ENV:-}" ] || [ -n "${BENCHMARK_SERVICE_AWS_SECRET_REFS:-}" ]; then
            benchmark_env_file="${RUNNER_TEMP}/benchmark-service.env"
            umask 077
            : > "${benchmark_env_file}"

            if [ -n "${BENCHMARK_SERVICE_AWS_SECRET_REFS:-}" ]; then
              python3 - "${benchmark_env_file}" <<'PY'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          env_path = Path(sys.argv[1])
          key_pattern = re.compile(r"[A-Za-z_][A-Za-z0-9_]*")

          for line_number, line in enumerate(os.environ["BENCHMARK_SERVICE_AWS_SECRET_REFS"].splitlines(), start=1):
              stripped = line.strip()
              if not stripped or stripped.startswith("#"):
                  continue
              key, separator, ref = stripped.partition("=")
              if not separator or not key_pattern.fullmatch(key):
                  sys.exit(
                      f"Invalid BENCHMARK_SERVICE_AWS_SECRET_REFS line {line_number}: "
                      "expected KEY=secret-id"
                  )

              secret_id = ref.strip()
              if not secret_id:
                  sys.exit(f"Invalid BENCHMARK_SERVICE_AWS_SECRET_REFS line {line_number}: expected KEY=secret-id")

              secret_string = subprocess.check_output(
                  [
                      "aws",
                      "secretsmanager",
                      "get-secret-value",
                      "--secret-id",
                      secret_id,
                      "--query",
                      "SecretString",
                      "--output",
                      "text",
                  ],
                  text=True,
              ).rstrip("\n")

              value = secret_string
              if "\n" in value:
                  sys.exit(f"AWS secret value for {key} contains a newline, which Docker env files do not support")

              print(f"::add-mask::{value}")
              with env_path.open("a", encoding="utf-8") as env_file:
                  print(f"{key}={value}", file=env_file)
          PY
            fi

            if [ -n "${BENCHMARK_SERVICE_ENV:-}" ]; then
              printf '%s\n' "${BENCHMARK_SERVICE_ENV}" >> "${benchmark_env_file}"
            fi

            python3 - "${benchmark_env_file}" <<'PY'
          import re
          import sys
          from pathlib import Path

          env_path = Path(sys.argv[1])
          key_pattern = re.compile(r"[A-Za-z_][A-Za-z0-9_]*")
          for line_number, line in enumerate(env_path.read_text().splitlines(), start=1):
              stripped = line.strip()
              if not stripped or stripped.startswith("#"):
                  continue
              key, separator, _ = line.partition("=")
              if not separator or not key_pattern.fullmatch(key):
                  sys.exit(f"Invalid BENCHMARK_SERVICE_ENV line {line_number}: expected KEY=value")
          PY
            docker_env_args+=(--env-file "${benchmark_env_file}")
          fi

          DOCKER_BUILDKIT=1 docker build "${docker_build_args[@]}" -t "${CONTAINER_NAME}:${GITHUB_SHA}" .

          docker run -d --name "${CONTAINER_NAME}" \
            "${docker_env_args[@]}" \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION="${AWS_REGION}" \
            -e AWS_DEFAULT_REGION="${AWS_REGION}" \
            -p "127.0.0.1:${SERVICE_PORT}:${CONTAINER_PORT}" \
            "${CONTAINER_NAME}:${GITHUB_SHA}"

          for _ in {1..60}; do
            curl -fsS "http://127.0.0.1:${SERVICE_PORT}${HEALTH_PATH}" && exit 0
            sleep 2
          done

          docker logs "${CONTAINER_NAME}"
          exit 1

      - name: Start smoke timeout proxy
        run: |
          set -euo pipefail

          valkyrie_python="$(head -n 1 "$(command -v valkyrie)")"
          valkyrie_python="${valkyrie_python#\#!}"

          cat > /tmp/benchmark-smoke-proxy.py <<'PY'
          from __future__ import annotations

          import asyncio
          import json
          import os
          from collections.abc import AsyncIterator

          import httpx
          import uvicorn
          import websockets
          from fastapi import FastAPI, Request, Response, WebSocket
          from starlette.responses import StreamingResponse
          from websockets.exceptions import ConnectionClosed

          SERVICE_URL = f"http://127.0.0.1:{os.environ['SERVICE_PORT']}"
          SERVICE_WS_URL = f"ws://127.0.0.1:{os.environ['SERVICE_PORT']}"
          PROXY_PORT = int(os.environ["PROXY_PORT"])
          HOP_BY_HOP_HEADERS = {
              "connection",
              "keep-alive",
              "proxy-authenticate",
              "proxy-authorization",
              "te",
              "trailer",
              "transfer-encoding",
              "upgrade",
              "content-length",
          }

          app = FastAPI()
          client = httpx.AsyncClient(timeout=None, follow_redirects=False)

          def filtered_headers(headers: httpx.Headers) -> dict[str, str]:
              return {
                  key: value
                  for key, value in headers.items()
                  if key.lower() not in HOP_BY_HOP_HEADERS
              }

          @app.api_route("/{path:path}", methods=["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS", "HEAD"])
          async def proxy_http(path: str, request: Request) -> Response:
              upstream_url = httpx.URL(f"{SERVICE_URL}/{path}").copy_with(query=request.url.query.encode())
              body = await request.body()
              upstream_response = await client.request(
                  request.method,
                  upstream_url,
                  content=body,
                  headers={
                      key: value
                      for key, value in request.headers.items()
                      if key.lower() not in HOP_BY_HOP_HEADERS and key.lower() != "host"
                  },
              )

              if request.method == "GET" and path.rstrip("/") == "retrieve-task":
                  payload = upstream_response.json()
                  payload["agent_timeout"] = 180.0
                  return Response(
                      content=json.dumps(payload),
                      status_code=upstream_response.status_code,
                      headers=filtered_headers(upstream_response.headers),
                      media_type="application/json",
                  )

              async def body_iterator() -> AsyncIterator[bytes]:
                  yield upstream_response.content

              return StreamingResponse(
                  body_iterator(),
                  status_code=upstream_response.status_code,
                  headers=filtered_headers(upstream_response.headers),
              )

          @app.websocket("/ws/{path:path}")
          async def proxy_websocket(path: str, websocket: WebSocket) -> None:
              await websocket.accept()
              upstream_url = f"{SERVICE_WS_URL}/ws/{path}"
              if websocket.url.query:
                  upstream_url = f"{upstream_url}?{websocket.url.query}"

              async with websockets.connect(upstream_url, ping_timeout=None) as upstream:
                  async def client_to_upstream() -> None:
                      while True:
                          message = await websocket.receive()
                          if "text" in message:
                              await upstream.send(message["text"])
                          elif "bytes" in message:
                              await upstream.send(message["bytes"])
                          elif message["type"] == "websocket.disconnect":
                              await upstream.close()
                              return

                  async def upstream_to_client() -> None:
                      async for message in upstream:
                          if isinstance(message, bytes):
                              await websocket.send_bytes(message)
                          else:
                              await websocket.send_text(message)

                  try:
                      await asyncio.gather(client_to_upstream(), upstream_to_client())
                  except ConnectionClosed:
                      return

          uvicorn.run(app, host="127.0.0.1", port=PROXY_PORT, log_level="info")
          PY

          "$valkyrie_python" /tmp/benchmark-smoke-proxy.py > /tmp/benchmark-smoke-proxy.log 2>&1 &
          echo "SMOKE_PROXY_PID=$!" >> "$GITHUB_ENV"

          for _ in {1..30}; do
            curl -fsS "http://127.0.0.1:${PROXY_PORT}${HEALTH_PATH}" && exit 0
            sleep 1
          done

          cat /tmp/benchmark-smoke-proxy.log
          exit 1

      - name: Install ngrok
        run: |
          set -euo pipefail

          curl -sSLo /tmp/ngrok.tgz https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
          sudo tar -xzf /tmp/ngrok.tgz -C /usr/local/bin
          ngrok version

      - name: Expose benchmark service with ngrok
        run: |
          set -euo pipefail

          ngrok config add-authtoken "${NGROK_AUTHTOKEN}"

          ngrok_args=(http "http://127.0.0.1:${PROXY_PORT}" --log stdout)
          if [ -n "${NGROK_URL:-}" ]; then
            ngrok_args+=(--url "${NGROK_URL}")
          else
            generated_ngrok_domain="$(
            python3 - <<'PY'
          import os
          import re

          benchmark_name = re.sub(r"[^a-z0-9-]+", "-", os.environ["BENCHMARK_NAME"].lower()).strip("-")
          benchmark_name = benchmark_name[:24].strip("-") or "benchmark"
          print(f"ci-{benchmark_name}-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}.ngrok.app")
          PY
          )"
            ngrok_args+=(--url "https://${generated_ngrok_domain}")
          fi

          ngrok "${ngrok_args[@]}" > /tmp/ngrok.log 2>&1 &
          echo "NGROK_PID=$!" >> "$GITHUB_ENV"

          for _ in {1..60}; do
            service_url="$(
            python3 - <<'PY'
          import json
          import urllib.request

          try:
              with urllib.request.urlopen("http://127.0.0.1:4040/api/tunnels", timeout=2) as response:
                  payload = json.load(response)
          except Exception:
              raise SystemExit(1)

          for tunnel in payload.get("tunnels", []):
              public_url = tunnel.get("public_url", "")
              if public_url.startswith("https://"):
                  print(public_url)
                  break
          else:
              raise SystemExit(1)
          PY
          )" || true

            public_service_url="${NGROK_PUBLIC_URL:-${service_url}}"
            if [ -n "${public_service_url}" ] &&
              curl -fsS --connect-timeout 10 --max-time 20 "${public_service_url}${HEALTH_PATH}"; then
              echo "SERVICE_URL=${public_service_url}" >> "$GITHUB_ENV"
              echo "ngrok URL: ${public_service_url}"
              exit 0
            fi
            sleep 5
          done

          cat /tmp/ngrok.log
          if [ -n "${service_url:-}" ]; then
            curl -v --connect-timeout 10 --max-time 20 "${service_url}${HEALTH_PATH}"
          fi
          exit 1

      - name: Configure Valkyrie SDK
        run: |
          set -euo pipefail

          mkdir -p ~/.config/valkyrie
          aws secretsmanager get-secret-value \
            --secret-id "${VALKYRIE_CONFIG_SECRET_ID}" \
            --query SecretString \
            --output text > ~/.config/valkyrie/valkyrie.yaml

          {
            printf '\n'
            printf 'AWS_ACCESS_KEY_ID: "%s"\n' "${AWS_ACCESS_KEY_ID}"
            printf 'AWS_SECRET_ACCESS_KEY: "%s"\n' "${AWS_SECRET_ACCESS_KEY}"
            printf 'AWS_SESSION_TOKEN: "%s"\n' "${AWS_SESSION_TOKEN}"
            printf 'AWS_DEFAULT_REGION: "%s"\n' "${AWS_REGION}"
          } >> ~/.config/valkyrie/valkyrie.yaml

      - name: Wait for tracker to reach benchmark service
        run: |
          set -euo pipefail

          valkyrie_python="$(head -n 1 "$(command -v valkyrie)")"
          valkyrie_python="${valkyrie_python#\#!}"

          "$valkyrie_python" - <<'PY'
          import asyncio
          import os
          import sys
          import time

          from valkyrie.sdk import BenchmarkServiceEntry, BenchmarkServicesResponse, ValkyrieClient, ValkyrieConfig
          from valkyrie.sdk.models.services import BenchmarkServicesRequest

          async def main() -> None:
              benchmark_name = os.environ["BENCHMARK_NAME"]
              service_url = os.environ["SERVICE_URL"]
              deadline = time.monotonic() + 300
              config = ValkyrieConfig.from_yaml()
              config.custom_benchmark_services[benchmark_name] = service_url
              entry = BenchmarkServiceEntry(name=benchmark_name, url=service_url)
              request = BenchmarkServicesRequest(services=[entry])

              async with ValkyrieClient(config) as client:
                  while True:
                      response = await client.request_model(
                          "POST",
                          "/benchmark-services",
                          BenchmarkServicesResponse,
                          json=request.model_dump(mode="json"),
                      )
                      health = response.services[0]
                      if health.healthy:
                          print(f"Tracker reached {benchmark_name} at {service_url} in {health.latency_ms} ms")
                          return

                      print(f"Tracker cannot reach {benchmark_name} at {service_url}: {health.error}")
                      if time.monotonic() >= deadline:
                          sys.exit("Tracker could not reach benchmark service before timeout")
                      await asyncio.sleep(10)

          asyncio.run(main())
          PY

      - name: Verify public websocket reachability
        run: |
          set -euo pipefail

          valkyrie_python="$(head -n 1 "$(command -v valkyrie)")"
          valkyrie_python="${valkyrie_python#\#!}"

          "$valkyrie_python" - <<'PY'
          import asyncio
          import os

          import websockets

          async def main() -> None:
              service_url = os.environ["SERVICE_URL"]
              websocket_url = service_url.replace("https://", "wss://").replace("http://", "ws://")
              async with websockets.connect(
                  f"{websocket_url}/ws/setup-task",
                  open_timeout=30,
                  ping_timeout=None,
              ):
                  print(f"Websocket reachable at {websocket_url}/ws/setup-task")

          asyncio.run(main())
          PY

      - name: Start one-task Valkyrie smoke run
        id: start-run
        run: |
          set -euo pipefail

          valkyrie_python="$(head -n 1 "$(command -v valkyrie)")"
          valkyrie_python="${valkyrie_python#\#!}"

          "$valkyrie_python" - <<'PY'
          import asyncio
          import os

          from valkyrie.sdk import ValkyrieClient, ValkyrieConfig

          async def main() -> None:
              benchmark_name = os.environ["BENCHMARK_NAME"]
              service_url = os.environ["SERVICE_URL"]
              model = os.environ.get("SMOKE_MODEL") or None
              config = ValkyrieConfig.from_yaml()
              config.custom_benchmark_services[benchmark_name] = service_url
              run_kwargs = {
                  "agent": os.environ["SMOKE_AGENT"],
                  "benchmark": benchmark_name,
                  "model": model,
                  "dataset": os.environ["SMOKE_DATASET"],
                  "task_ids": [os.environ["SMOKE_TASK_ID"]],
                  "concurrency": 1,
                  "label": f"ci-{os.environ['GITHUB_REF_NAME']}-{os.environ['GITHUB_SHA']}",
              }
              if os.environ.get("NO_MODEL_GATEWAY", "").lower() == "true":
                  run_kwargs["agent_kwargs"] = {"no_model_gateway": "true"}

              print(f"Starting {benchmark_name} smoke run against {service_url}")
              async with ValkyrieClient(config) as client:
                  run = await client.runs.start(**run_kwargs)

              print(f"Run ID: {run.benchmark_id}")
              print(f"Task count: {run.task_count}")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                  print(f"VALKYRIE_RUN_ID={run.benchmark_id}", file=env_file)
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
                  print(f"valkyrie_run_id={run.benchmark_id}", file=output_file)

          asyncio.run(main())
          PY

      - name: Wait for smoke result
        run: |
          set -euo pipefail

          valkyrie_python="$(head -n 1 "$(command -v valkyrie)")"
          valkyrie_python="${valkyrie_python#\#!}"

          "$valkyrie_python" - <<'PY'
          import asyncio
          import os
          import sys
          from uuid import UUID

          from tracker.types import FinalViewResponse
          from valkyrie.sdk import BenchmarkStatus, TaskStatus, ValkyrieClient, ValkyrieConfig
          from valkyrie.sdk.errors import ValkyrieAPIError

          async def fetch_final_view(client: ValkyrieClient, run_id: UUID) -> FinalViewResponse:
              return await client.request_model(
                  "GET",
                  "/retrieve-results",
                  FinalViewResponse,
                  params={"benchmark_id": str(run_id), "s3": False},
              )

          def exit_with_final_view(final_view: FinalViewResponse) -> None:
              final_status_value = final_view.status.value
              for task_id, task_error in (final_view.task_errors or {}).items():
                  first_line = str(task_error).splitlines()[0]
                  print(f"Task error {task_id}: {first_line}")

              message = (final_view.error_message or "").splitlines()[0]
              sys.exit(f"Smoke run failed with {final_status_value}: {message}")

          async def main() -> None:
              benchmark_name = os.environ["BENCHMARK_NAME"]
              service_url = os.environ["SERVICE_URL"]
              run_id = UUID(os.environ["VALKYRIE_RUN_ID"])
              wait_attempts = int(os.environ["WAIT_ATTEMPTS"])
              config = ValkyrieConfig.from_yaml()
              config.custom_benchmark_services[benchmark_name] = service_url

              final_status = None
              final_counts: dict[str, int] = {}
              last_fetch_error = None
              async with ValkyrieClient(config) as client:
                  for _ in range(wait_attempts):
                      try:
                          run = await client.runs.fetch(run_id)
                      except ValkyrieAPIError as error:
                          last_fetch_error = error
                          try:
                              final_view = await fetch_final_view(client, run_id)
                          except ValkyrieAPIError as results_error:
                              print(f"Could not fetch smoke run yet: {error}; results fallback: {results_error}")
                              await asyncio.sleep(30)
                              continue

                          final_status_value = final_view.status.value
                          if final_status_value == BenchmarkStatus.FINISHED.value:
                              error_count = len(final_view.task_errors or {})
                              stopped_count = len(final_view.tasks_stopped or [])
                              print(
                                  f"{final_status_value}: "
                                  f"results={len(final_view.evaluation_results or {})}, "
                                  f"task_errors={error_count}, stopped={stopped_count}"
                              )
                              if error_count or stopped_count:
                                  sys.exit(f"Smoke task failed: task_errors={error_count}, stopped={stopped_count}")
                              return
                          if final_status_value in {BenchmarkStatus.ERROR.value, BenchmarkStatus.STOPPED.value}:
                              exit_with_final_view(final_view)

                          print(f"Could not fetch smoke run yet: {error}; results status: {final_status_value}")
                          await asyncio.sleep(30)
                          continue

                      final_status = run.details.status
                      final_counts = {
                          status.value if isinstance(status, TaskStatus) else str(status): count
                          for status, count in run.details.task_breakdown.items()
                      }
                      print(f"{final_status.value}: {final_counts}")
                      if final_status == BenchmarkStatus.FINISHED:
                          break
                      if final_status in {BenchmarkStatus.ERROR, BenchmarkStatus.STOPPED}:
                          try:
                              final_view = await fetch_final_view(client, run_id)
                          except ValkyrieAPIError as error:
                              sys.exit(
                                  f"Smoke run failed with {final_status.value}; "
                                  f"could not fetch result details: {error}"
                              )
                          exit_with_final_view(final_view)
                      await asyncio.sleep(30)

              if final_status != BenchmarkStatus.FINISHED:
                  if last_fetch_error is not None:
                      sys.exit(f"Run did not finish successfully after fetch error: {last_fetch_error}")
                  sys.exit(f"Run did not finish successfully: {final_status}")
              if final_counts.get(TaskStatus.ERROR.value, 0) or final_counts.get(TaskStatus.STOPPED.value, 0):
                  sys.exit(f"Smoke task failed: {final_counts}")

          asyncio.run(main())
          PY

      - name: Dump benchmark service logs
        if: failure()
        run: docker logs "${CONTAINER_NAME}" || true

      - name: Stop ngrok tunnel
        if: always()
        run: |
          if [ -n "${NGROK_PID:-}" ]; then
            kill "${NGROK_PID}" || true
          fi

      - name: Stop smoke timeout proxy
        if: always()
        run: |
          if [ -n "${SMOKE_PROXY_PID:-}" ]; then
            kill "${SMOKE_PROXY_PID}" || true
          fi
