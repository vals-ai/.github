name: Claude security review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: org-claude-security-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-review:
    uses: vals-ai/.github/.github/workflows/claude-security-review.yml@7c40500a6a096965bda5df48eff7d6edc7e0762a
    secrets:
      ANTHROPIC_SECURITY_REVIEW_API_KEY: ${{ secrets.ANTHROPIC_SECURITY_REVIEW_API_KEY }}
