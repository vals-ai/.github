name: Claude security review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: org-claude-security-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-review:
    uses: vals-ai/.github/.github/workflows/claude-security-review.yml@a05876e2c466dcdc413f28ab76297787c9274df1
    secrets:
      ANTHROPIC_SECURITY_REVIEW_API_KEY: ${{ secrets.ANTHROPIC_SECURITY_REVIEW_API_KEY }}
