name: Claude security review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: org-claude-security-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-review:
    uses: vals-ai/.github/.github/workflows/claude-security-review.yml@95522b7f6cade5151f528315232e78eda82a8108
    secrets:
      ANTHROPIC_SECURITY_REVIEW_API_KEY: ${{ secrets.ANTHROPIC_SECURITY_REVIEW_API_KEY }}
