name: validate-cbs-latest-tag (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Validate latest create-benchmark-service tag pin
        run: |
          set -euo pipefail

          dependency_name="create-benchmark-service"

          IFS=$'\t' read -r cbs_requirement repository_url <<<"$(
            uv run --no-project python - <<'PY'
          import tomllib
          from pathlib import Path
          from urllib.parse import parse_qs, urlsplit, urlunsplit

          dependency_name = "create-benchmark-service"
          lock = tomllib.loads(Path("uv.lock").read_text())

          for package in lock["package"]:
              if package["name"] != dependency_name:
                  continue
              source_git = package["source"]["git"]
              split_url = urlsplit(source_git)
              repository_url = urlunsplit(
                  (split_url.scheme, split_url.netloc, split_url.path, "", "")
              )
              query = parse_qs(split_url.query)
              ref = split_url.fragment or query.get(
                  "tag", query.get("rev", query.get("branch", [""]))
              )[0]
              if not ref:
                  raise SystemExit(f"{dependency_name} lock entry has no git ref")
              subdirectory = query.get("subdirectory", [""])[0]
              suffix = f"#subdirectory={subdirectory}" if subdirectory else ""
              print(f"{dependency_name} @ git+{repository_url}@{ref}{suffix}\t{repository_url}")
              break
          else:
              raise SystemExit(f"{dependency_name} was not found in uv.lock")
          PY
          )"

          # The framework moved into vals-ai/Valkyrie, which tags its releases cbs-v<version>.
          tag_prefix="v"
          case "${repository_url,,}" in
            https://github.com/vals-ai/valkyrie | https://github.com/vals-ai/valkyrie.git) tag_prefix="cbs-v" ;;
          esac

          uv venv .cbs-check-venv --python 3.12
          uv pip install --python .cbs-check-venv/bin/python --no-deps "${cbs_requirement}"

          latest_tag="$(
            git ls-remote --refs --tags --sort=-version:refname \
              "${repository_url}" "refs/tags/${tag_prefix}*" \
              | awk '!tag { tag = $2 } END { sub("refs/tags/", "", tag); print tag }'
          )"

          if [ -z "${latest_tag}" ]; then
            echo "::error::No ${tag_prefix}* tags found for ${repository_url}"
            exit 1
          fi

          installed_version="$(
            .cbs-check-venv/bin/python - "${dependency_name}" <<'PY'
          import importlib.metadata
          import sys

          print(importlib.metadata.version(sys.argv[1]))
          PY
          )"
          latest_version="${latest_tag#"${tag_prefix}"}"

          echo "Installed ${dependency_name} version: ${installed_version}"
          echo "Latest ${dependency_name} tag: ${latest_tag}"

          if [ "${installed_version}" != "${latest_version}" ]; then
            echo "::error::create-benchmark-service is required to be the latest release (${latest_tag}). Move its source to that tag, run 'uv lock', and try again."
            exit 1
          fi
