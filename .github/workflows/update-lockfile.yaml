name: update-lockfile (reusable)

on:
  workflow_call:
    secrets:
      GH_PAT:
        required: true
      SLACK_WEBHOOK_URL:
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Detect current framework pin
        id: current-pin
        run: |
          REF=$(sed -n 's|.*create-benchmark-service\.git@\([^"]*\).*|\1|p' pyproject.toml | head -1)
          echo "ref=${REF:-}" >> "$GITHUB_OUTPUT"

      - name: Find latest create-benchmark-service tag
        id: latest-tag
        run: |
          TAG=$(git ls-remote --tags --sort=-version:refname \
            https://github.com/vals-ai/create-benchmark-service.git 'refs/tags/v*' \
            | grep -v '\^{}$' | head -1 | awk '{print $2}' | sed 's|refs/tags/||')
          if [ -z "$TAG" ]; then
            echo "::warning::No tags found for create-benchmark-service"
          else
            echo "Latest tag: $TAG"
          fi
          echo "tag=${TAG:-}" >> "$GITHUB_OUTPUT"

      - name: Build changelog
        id: changelog
        if: steps.latest-tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          CURRENT_REF: ${{ steps.current-pin.outputs.ref }}
          LATEST_TAG: ${{ steps.latest-tag.outputs.tag }}
        run: |
          if [[ "$CURRENT_REF" =~ ^v[0-9] ]] && [ "$CURRENT_REF" != "$LATEST_TAG" ]; then
            BODY=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/vals-ai/create-benchmark-service/compare/${CURRENT_REF}...${LATEST_TAG}" \
              | jq -r '[.commits[].commit.message | split("\n")[0] | select(test("#[0-9]+"))] | map("- " + .) | join("\n")')
            {
              echo "body<<EOF"
              echo "### Changes since \`${CURRENT_REF}\`"
              echo ""
              echo "${BODY}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          elif [[ ! "$CURRENT_REF" =~ ^v[0-9] ]]; then
            {
              echo "body<<EOF"
              echo "Initial migration from \`@${CURRENT_REF}\` to tagged releases."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "body=" >> "$GITHUB_OUTPUT"
          fi

      - name: Update framework pin to latest tag
        if: steps.latest-tag.outputs.tag != ''
        env:
          TAG: ${{ steps.latest-tag.outputs.tag }}
        run: |
          sed -i "s|create-benchmark-service\.git@[^\"]*|create-benchmark-service.git@${TAG}|" pyproject.toml

      - name: Update lockfile
        if: steps.latest-tag.outputs.tag != ''
        run: uv lock

      - uses: peter-evans/create-pull-request@v8
        if: steps.latest-tag.outputs.tag != ''
        id: cpr
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: 'chore: bump create-benchmark-service to ${{ steps.latest-tag.outputs.tag }}'
          title: 'chore: bump create-benchmark-service to ${{ steps.latest-tag.outputs.tag }}'
          body: |
            Automated bump of `create-benchmark-service` from `${{ steps.current-pin.outputs.ref }}` to `${{ steps.latest-tag.outputs.tag }}`.

            ${{ steps.changelog.outputs.body }}

            Tests, lint, and typecheck must pass before merge.
          branch: chore/update-cbs-lockfile
          delete-branch: true

      - name: Notify Slack
        if: steps.cpr.outputs.pull-request-operation == 'created'
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"📦 Lockfile update PR ($REPO): $PR_URL\"}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          REPO: ${{ github.repository }}
