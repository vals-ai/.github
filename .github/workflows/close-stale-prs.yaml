name: close-stale-prs (reusable)

on:
  workflow_call:
    inputs:
      days-before-pr-stale:
        description: 'Days of inactivity before a PR is marked stale.'
        required: false
        default: 7
        type: number
      days-before-pr-close:
        description: 'Days after a PR is marked stale before it is closed.'
        required: false
        default: 4
        type: number
      stale-pr-message:
        description: 'Comment posted to the PR thread when it is marked stale.'
        required: false
        default: 'This pull request has had no activity for 7 days. It will be closed automatically in 4 days unless there is new activity.'
        type: string
      close-pr-message:
        description: 'Comment posted to the PR thread when it is closed for inactivity.'
        required: false
        default: 'This pull request was closed automatically due to inactivity.'
        type: string
      exempt-draft-pr:
        description: 'If true, draft PRs are exempt from being marked stale.'
        required: false
        default: false
        type: boolean
      exempt-pr-labels:
        description: 'Comma-separated list of labels that exempt a PR from being marked stale.'
        required: false
        default: ''
        type: string
      stale-pr-label:
        description: 'Label applied to PRs once they are marked stale.'
        required: false
        default: 'stale'
        type: string

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          days-before-pr-stale: ${{ inputs.days-before-pr-stale }}
          days-before-pr-close: ${{ inputs.days-before-pr-close }}
          stale-pr-message: ${{ inputs.stale-pr-message }}
          close-pr-message: ${{ inputs.close-pr-message }}
          stale-pr-label: ${{ inputs.stale-pr-label }}
          exempt-pr-labels: ${{ inputs.exempt-pr-labels }}
          exempt-draft-pr: ${{ inputs.exempt-draft-pr }}
          days-before-issue-stale: -1
          days-before-issue-close: -1
