name: Claude security review (reusable)

on:
  workflow_call:
    secrets:
      ANTHROPIC_SECURITY_REVIEW_API_KEY:
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >-
      github.event_name == 'pull_request' &&
      github.repository_owner == 'vals-ai' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Verify current author write access
        id: trust
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          trusted=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$PR_AUTHOR/permission" --jq '.user.permissions.push == true')
          echo "trusted=$trusted" >> "$GITHUB_OUTPUT"
          if [ "$trusted" != 'true' ]; then
            echo 'Security review skipped: the PR author does not currently have repository write access.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check dedicated review credential
        if: steps.trust.outputs.trusted == 'true'
        id: credential
        env:
          REVIEW_KEY: ${{ secrets.ANTHROPIC_SECURITY_REVIEW_API_KEY }}
        run: |
          if [ -n "$REVIEW_KEY" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Security review is not configured: ANTHROPIC_SECURITY_REVIEW_API_KEY is missing.'
            echo 'Security review skipped: the dedicated Anthropic credential has not been configured. This is not a clean security result.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out the exact PR revision
        if: steps.credential.outputs.available == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the pinned scanner
        if: steps.credential.outputs.available == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: anthropics/claude-code-security-review
          ref: 0c6a49f1fa56a1d472575da86a94dbc1edb78eda
          path: .security-review-action
          persist-credentials: false

      - name: Check out the reviewed Git diff adapter
        if: steps.credential.outputs.available == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: vals-ai/.github
          ref: 83845361f89d31929776ae105a76e7d670928ab4
          path: .security-review-tools
          persist-credentials: false

      - name: Apply the Git diff adapter to the pinned scanner
        if: steps.credential.outputs.available == 'true'
        run: |
          git -C .security-review-action apply --check "$GITHUB_WORKSPACE/.security-review-tools/.github/security-review/local-diff.patch"
          git -C .security-review-action apply "$GITHUB_WORKSPACE/.security-review-tools/.github/security-review/local-diff.patch"
          cp .security-review-tools/.github/security-review/local_diff.py .security-review-action/local_diff.py

      - name: Prepare custom scan instructions
        if: steps.credential.outputs.available == 'true'
        env:
          INSTRUCTIONS_FILE: ${{ runner.temp }}/security-review-instructions.txt
        run: |
          cat > "$INSTRUCTIONS_FILE" <<'INSTRUCTIONS'
          **Vals Business Confidentiality (paywalled benchmark data and frontier-lab trust):**

          Vals sells access to private benchmark data and evaluates pre-release models under confidentiality with frontier labs. A change that moves confidential material onto a public surface is a data exposure even without an attacker: publishing it is the breach. Writing data into a published artifact is exposure, not "data stored on disk". Report it as HIGH when the data reaches a public surface on merge or the next routine export/deploy, MEDIUM when it needs a further step.

          - Public surfaces: anything bundled into the public website or its data files (frontend `src/data/`, generated `*_view*.json`, static assets), public API or MCP responses, public repositories, packages or container images, unauthenticated buckets or URLs, and logs or CI artifacts readable outside Vals.
          - Paywalled benchmark data: questions, prompts, task inputs, reference answers, rubrics, ground truth, test cases, grader prompts, and per-task model outputs or trajectories from datasets that are private, held-out, scored, or sold. Flag code that publishes them, and removal or weakening of gates that restrict publication to public splits, reviewed examples, or allowlists.
          - Lab-confidential information: unreleased or codename model identifiers, provider endpoint and routing IDs, pre-release or embargoed results, early-access status, provider rate limits, quotas and client settings, and contract or pricing terms. Flag new fields or overrides that carry these into public outputs, removal of strip lists, visibility flags, or release-date gates, and serializers that switch from an allowlist of fields to dumping every field.
          - Name the public surface, the class of confidential data, and the line that introduces the flow. Recommend an allowlist or gate. Skip data for benchmarks marked public and models the repository already treats as released; flag when release or access status is unknown, private, or early-access.

          **Finding write-up limits (output style, not a vulnerability category):**

          Each field is rendered verbatim into a pull request comment. Keep them tight.

          - description: a couple of sentences naming the flaw and the component that carries it. It is rendered as the comment's bold title, so never write a paragraph.
          - exploit_scenario: at most 3 sentences and 60 words. The attacker's starting position, the action that abuses the flaw, the impact.
          - recommendation: at most 2 sentences and 40 words, imperative. One primary fix.
          - No bold, headings, bullet lists, or code fences inside a field. Inline backticks are fine.
          INSTRUCTIONS

      - name: Review changes
        if: steps.credential.outputs.available == 'true'
        uses: ./.security-review-action
        env:
          SECURITY_REVIEW_REPO_PATH: ${{ github.workspace }}/source
          SECURITY_REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SECURITY_REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_SECURITY_REVIEW_API_KEY }}
          claude-model: claude-opus-5
          comment-pr: 'true'
          upload-results: 'true'
          run-every-commit: 'true'
          claudecode-timeout: '40'
          custom-security-scan-instructions: ${{ runner.temp }}/security-review-instructions.txt

      - name: Verify the scanner completed
        if: steps.credential.outputs.available == 'true'
        run: |
          if ! jq -e '
            type == "object" and
            (.error == null) and
            (.findings | type == "array") and
            (.analysis_summary.review_completed != false) and
            (.filtering_summary | type == "object")
          ' claudecode-results.json > /dev/null; then
            echo '::error::Security analysis did not complete. Inspect the scanner logs; this is not a clean security result.'
            exit 1
          fi
          count=$(jq '.findings | length' claudecode-results.json)
          printf 'Security review completed with %s finding(s). Findings are advisory; inspect the PR comments and security-review-results artifact.\n' "$count" >> "$GITHUB_STEP_SUMMARY"
